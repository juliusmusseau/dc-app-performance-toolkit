# Defines which column from test runs is used for aggregated report. Default is "90% Line"
column_name: "90% Line"
runs:
  # relativePath should contain a relative path to the directory with run results starting from dc-app-performance-toolkit folder.
  # E.g. relativePath: "./app/results/jira/2024-01-01_10-10-10"
  - runName: "1 Node"
    runType: "baseline"
    relativePath: "./app/results/bitbucket/bitbucket-1-node-2024-10-26"
  - runName: "2 Nodes"
    runType: "experiment"
    relativePath: "./app/results/bitbucket/bitbucket-2-node-2024-10-26"
  - runName: "4 Nodes"
    runType: "experiment"
    relativePath: "./app/results/bitbucket/bitbucket-4-node-2024-10-26"


# Chart generation configs
index_col: "Action"
title: "DCAPT Scale Testing"
image_height_px: 1000
image_width_px: 1600
